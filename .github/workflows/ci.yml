name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # historique complet pour scanner tous les fichiers suivis

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Scan secrets (garde-fou anti-fuite)
        run: python scripts/check_secrets.py

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Même version que l'image Docker de production (backend/Dockerfile) :
        # on teste ce qui tourne réellement. Les dépendances figées de
        # requirements.txt (pydantic 2.5, aiohttp 3.9) ne s'installent pas
        # toujours sur les Python plus récents.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Test with pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short

  flutter:
    # Sans ce job, une app qui ne compile pas passait la CI (le backend seul
    # était testé).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy:
    # Le projet est hébergé sur Render (voir render.yaml et docs/DEPLOY.md).
    # Render reconstruit l'image Docker quand on appelle le « Deploy Hook ».
    # Secret à créer : RENDER_DEPLOY_HOOK_URL (Render > service > Settings >
    # Deploy Hook). Sans ce secret, l'étape est ignorée (pas d'échec de CI).
    needs: [test, flutter]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL absent : déploiement ignoré."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Déploiement Render déclenché."
