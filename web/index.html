<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1565c0">
<title>Ecahier — Caisse</title>
<style>
:root{--pri:#1565c0;--pri2:#0d47a1;--ok:#2e7d32;--warn:#ef6c00;--bad:#c62828;--bg:#f4f6f9;--card:#fff;--ink:#1a2332;--mut:#6b7686;--line:#e3e8ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:1rem 1rem 1.1rem;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
header .sub{font-size:.8rem;opacity:.85;margin-top:.15rem}
nav{display:flex;gap:.25rem;margin-top:.75rem;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:0;background:rgba(255,255,255,.14);color:#fff;padding:.5rem .75rem;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:var(--pri)}
main{padding:1rem;max-width:760px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat .lbl{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:1.5rem;font-weight:800;margin-top:.25rem}
.stat .val.ok{color:var(--ok)}.stat .val.warn{color:var(--warn)}.stat .val.bad{color:var(--bad)}
h2{font-size:1rem;margin:1.25rem 0 .6rem}
.row{display:flex;gap:.5rem;align-items:center}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
button.btn{background:var(--pri);color:#fff;border:0;padding:.65rem 1rem;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem}
button.btn:active{transform:scale(.98)}
button.btn.ghost{background:#eef3fb;color:var(--pri)}
button.btn.sm{padding:.35rem .6rem;font-size:.8rem}
.list{display:flex;flex-direction:column;gap:.5rem}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem}
.item .top{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.item .name{font-weight:700}
.item .meta{font-size:.8rem;color:var(--mut);margin-top:.2rem}
.badge{font-size:.7rem;font-weight:700;padding:.2rem .5rem;border-radius:999px}
.badge.pending{background:#fff3e0;color:var(--warn)}
.badge.partial{background:#e3f2fd;color:var(--pri)}
.badge.paid{background:#e8f5e9;color:var(--ok)}
.badge.cancelled{background:#eceff1;color:var(--mut)}
.badge.overdue{background:#ffebee;color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:2rem 1rem}
.err{background:#ffebee;color:var(--bad);border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin:.5rem 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1.25rem;background:#263238;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.frm{display:grid;gap:.6rem}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mt{margin-top:.75rem}
.muted{color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>🗂️ Ecahier</h1>
  <div class="sub">Caisse & crédit boutique — <span id="health">…</span></div>
  <nav id="nav">
    <button data-tab="home" class="on">Accueil</button>
    <button data-tab="customers">Clients</button>
    <button data-tab="credits">Crédits</button>
    <button data-tab="payments">Paiements</button>
    <button data-tab="sync">Sync</button>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<script>
const API = (window.location.protocol === 'https:' ? '' : '') + '/api';
const $ = s => document.querySelector(s);
const fmt = n => { const v = Number(n)||0; return v.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' FCFA'; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortId = id => String(id||'').slice(0,8);
async function J(u, method='GET', body=null){
  const opt = {method, headers:{}};
  if(body){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(API+u, opt);
  if(!r.ok){ const t = await r.text(); throw new Error(r.status+' '+(t||'Erreur')); }
  return r.json();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }
function badge(status, overdue){ let b='<span class="badge '+status+'">'+status+'</span>'; if(overdue) b+=' <span class="badge overdue">en retard</span>'; return b; }

let state = { tab:'home', customers:[], credits:[], payments:[] };

async function loadAll(){
  try{
    const [c, cr, p] = await Promise.all([ J('/customers/'), J('/credits/'), J('/payments/') ]);
    state.customers = c.customers||[]; state.credits = cr.credits||[]; state.payments = p.payments||[];
  }catch(e){ /* ignore */ }
}

/* ---------- ACCUEIL ---------- */
async function renderHome(){
  let cust=0, cr=0, pay=0, encours=0, impayes=0;
  try{
    const [c, credits, payments, health] = await Promise.all([ J('/customers/'), J('/credits/'), J('/payments/'), J('/health') ]);
    cust = c.total||0; cr = credits.total||0; pay = payments.total||0;
    for(const x of (credits.credits||[])){ if(x.status!=='paid' && x.status!=='cancelled'){ encours += Number(x.amount)||0; } if(x.is_overdue) impayes++; }
    $('#health').textContent = 'en ligne — v'+(health.version||'');
  }catch(e){ $('#health').textContent='hors ligne'; }
  $('#view').innerHTML = `
    <div class="grid">
      <div class="card stat"><div class="lbl">Clients</div><div class="val">${cust}</div></div>
      <div class="card stat"><div class="lbl">Crédits</div><div class="val">${cr}</div></div>
      <div class="card stat"><div class="lbl">Paiements</div><div class="val">${pay}</div></div>
      <div class="card stat"><div class="lbl">Encours</div><div class="val ${encours>0?'warn':''}">${fmt(encours)}</div></div>
    </div>
    ${impayes? `<div class="err">⚠️ ${impayes} crédit(s) en retard de paiement</div>`:''}
    <h2>Derniers clients</h2>
    <div class="list" id="home-cust"></div>`;
  const list = $('#home-cust');
  const recent = state.customers.slice(0,5);
  if(!recent.length){ list.innerHTML='<div class="empty">Aucun client</div>'; return; }
  for(const c of recent){
    list.insertAdjacentHTML('beforeend', `<div class="item">
      <div class="top"><span class="name">${esc(c.name)}</span><span class="muted">${esc(c.phone||'')}</span></div>
      <div class="meta">Crédit ${fmt(c.total_credit)} · Payé ${fmt(c.total_paid)} · <b>Solde ${fmt(c.balance)}</b></div>
    </div>`);
  }
}

/* ---------- CLIENTS ---------- */
async function renderCustomers(){
  await loadAll();
  $('#view').innerHTML = `
    <h2>Nouveau client</h2>
    <div class="card frm">
      <input id="c-name" placeholder="Nom du client *">
      <div class="two"><input id="c-phone" placeholder="Téléphone"><input id="c-address" placeholder="Adresse"></div>
      <button class="btn" id="c-add">Enregistrer</button>
    </div>
    <h2>Clients (${state.customers.length})</h2>
    <input id="c-search" placeholder="Rechercher un client…" class="mt">
    <div class="list mt" id="cust-list"></div>`;
  $('#c-add').onclick = async ()=>{
    const name = $('#c-name').value.trim();
    if(!name){ toast('Le nom est obligatoire'); return; }
    try{
      await J('/customers/', 'POST', {name, phone:$('#c-phone').value.trim(), address:$('#c-address').value.trim()});
      toast('Client ajouté'); $('#c-name').value=''; $('#c-phone').value=''; $('#c-address').value='';
      renderCustomers();
    }catch(e){ toast('Erreur : '+e.message); }
  };
  const draw = ()=>{
    const q = ($('#c-search').value||'').toLowerCase();
    const list = $('#cust-list'); list.innerHTML='';
    const f = state.customers.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));
    if(!f.length){ list.innerHTML='<div class="empty">Aucun client</div>'; return; }
    for(const c of f){
      list.insertAdjacentHTML('beforeend', `<div class="item">
        <div class="top"><span class="name">${esc(c.name)}</span>${c.balance>0?`<span class="badge pending">dette ${fmt(c.balance)}</span>`:`<span class="badge paid">à jour</span>`}</div>
        <div class="meta">${esc(c.phone||'—')} · ${esc(c.address||'')}</div>
        <div class="meta">Crédit ${fmt(c.total_credit)} · Payé ${fmt(c.total_paid)}</div>
      </div>`);
    }
  };
  $('#c-search').oninput = draw; draw();
}

/* ---------- CRÉDITS ---------- */
async function renderCredits(){
  await loadAll();
  const opts = state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#view').innerHTML = `
    <h2>Nouveau crédit</h2>
    <div class="card frm">
      <select id="cr-cust"><option value="">Sélectionner un client *</option>${opts}</select>
      <div class="two"><input id="cr-amount" type="number" min="1" placeholder="Montant (FCFA) *"><input id="cr-due" type="date"></div>
      <input id="cr-desc" placeholder="Description (optionnel)">
      <button class="btn" id="cr-add">Créer le crédit</button>
    </div>
    <h2>Crédits (${state.credits.length})</h2>
    <div class="list" id="cr-list"></div>`;
  $('#cr-add').onclick = async ()=>{
    const cid = $('#cr-cust').value, amt = $('#cr-amount').value;
    if(!cid){ toast('Choisissez un client'); return; }
    if(!amt || Number(amt)<=0){ toast('Montant invalide'); return; }
    try{
      await J('/credits/', 'POST', {customer_id:cid, amount:amt, description:$('#cr-desc').value.trim(), due_date: $('#cr-due').value || null});
      toast('Crédit créé'); renderCredits();
    }catch(e){ toast('Erreur : '+e.message); }
  };
  const list = $('#cr-list');
  if(!state.credits.length){ list.innerHTML='<div class="empty">Aucun crédit</div>'; return; }
  const cmap = Object.fromEntries(state.customers.map(c=>[c.id,c]));
  for(const cr of state.credits){
    const c = cmap[cr.customer_id]||{};
    list.insertAdjacentHTML('beforeend', `<div class="item">
      <div class="top"><span class="name">${fmt(cr.amount)}</span>${badge(cr.status, cr.is_overdue)}</div>
      <div class="meta">${esc(c.name||'Client inconnu')} · ${esc(cr.description||'')}</div>
      <div class="meta">Échéance : ${esc((cr.due_date||'').slice(0,10))} · #${shortId(cr.id)}</div>
    </div>`);
  }
}

/* ---------- PAIEMENTS ---------- */
async function renderPayments(){
  await loadAll();
  const copts = state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const ropts = state.credits.filter(c=>c.status!=='paid'&&c.status!=='cancelled').map(c=>`<option value="${c.id}">${fmt(c.amount)} — ${shortId(c.id)}</option>`).join('');
  $('#view').innerHTML = `
    <h2>Enregistrer un paiement</h2>
    <div class="card frm">
      <select id="p-cust"><option value="">Sélectionner un client *</option>${copts}</select>
      <select id="p-cred"><option value="">Crédit associé *</option>${ropts}</select>
      <div class="two"><input id="p-amount" type="number" min="1" placeholder="Montant (FCFA) *">
      <select id="p-method"><option value="cash">Espèces</option><option value="mobile_money">Mobile money</option><option value="bank_transfer">Virement</option><option value="other">Autre</option></select></div>
      <input id="p-ref" placeholder="Référence (optionnel)">
      <button class="btn" id="p-add">Enregistrer le paiement</button>
    </div>
    <h2>Paiements (${state.payments.length})</h2>
    <div class="list" id="p-list"></div>`;
  $('#p-add').onclick = async ()=>{
    const cid=$('#p-cust').value, kid=$('#p-cred').value, amt=$('#p-amount').value;
    if(!cid||!kid){ toast('Client et crédit requis'); return; }
    if(!amt||Number(amt)<=0){ toast('Montant invalide'); return; }
    try{
      await J('/payments/', 'POST', {customer_id:cid, credit_id:kid, amount:amt, method:$('#p-method').value, reference:$('#p-ref').value.trim()});
      toast('Paiement enregistré'); renderPayments();
    }catch(e){ toast('Erreur : '+e.message); }
  };
  const list = $('#p-list');
  if(!state.payments.length){ list.innerHTML='<div class="empty">Aucun paiement</div>'; return; }
  const cmap = Object.fromEntries(state.customers.map(c=>[c.id,c]));
  for(const p of state.payments){
    const c = cmap[p.customer_id]||{};
    const mlbl = {cash:'Espèces',mobile_money:'Mobile money',bank_transfer:'Virement',other:'Autre'}[p.method]||p.method;
    list.insertAdjacentHTML('beforeend', `<div class="item">
      <div class="top"><span class="name">+${fmt(p.amount)}</span><span class="badge paid">${mlbl}</span></div>
      <div class="meta">${esc(c.name||'Client inconnu')} · ${esc(p.reference||'')}</div>
      <div class="meta">${esc((p.payment_date||'').slice(0,16).replace('T',' '))} · #${shortId(p.id)}</div>
    </div>`);
  }
}

/* ---------- SYNC ---------- */
async function renderSync(){
  let st=null;
  try{ st = await J('/sync/status'); }catch(e){}
  $('#view').innerHTML = `
    <h2>Synchronisation</h2>
    <div class="card">
      ${st? `
      <div class="row" style="justify-content:space-between"><span class="muted">Opérations en attente</span><b>${st.pending_count}</b></div>
      <div class="row" style="justify-content:space-between;margin-top:.5rem"><span class="muted">Serveur configuré</span><b>${st.server_url?'oui':'non'}</b></div>
      <div class="row" style="justify-content:space-between;margin-top:.5rem"><span class="muted">Dernière sync</span><b>${st.last_sync?esc(String(st.last_sync).slice(0,16).replace('T',' ')):'jamais'}</b></div>
      <button class="btn mt" id="s-sync" ${st.is_syncing?'disabled':''}>${st.is_syncing?'Synchronisation…':'Synchroniser maintenant'}</button>
      ` : '<div class="err">Impossible de récupérer le statut de sync</div>'}
    </div>
    <p class="muted mt">En mode hors-ligne, les données sont stockées localement (SQLite) et poussées vers le serveur dès que la connexion revient.</p>`;
  const btn = $('#s-sync');
  if(btn) btn.onclick = async ()=>{
    btn.disabled = true; btn.textContent = 'Synchronisation…';
    try{ await J('/sync/push', 'POST', {}); toast('Sync terminée'); }
    catch(e){ /* 404 si pas de serveur */ toast('Sync terminée (aucun serveur distant)'); }
    renderSync();
  };
}

/* ---------- ROUTER ---------- */
const tabs = {home:renderHome, customers:renderCustomers, credits:renderCredits, payments:renderPayments, sync:renderSync};
async function go(tab){
  state.tab = tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  $('#view').innerHTML = '<div class="empty">Chargement…</div>';
  await tabs[tab]();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
go('home');
</script>
</body>
</html>
